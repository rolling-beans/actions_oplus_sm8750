        run: |
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
          echo "📦 Enabling SUSFS inside KernelSU..."
          ( cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch )
          echo "📦 Applying SUSFS kernel patch..."
          patch -p1 < 50_add_susfs_in_gki-android15-6.6.patch

      - name: 📦 Apply SUSFS (KernelSU Next)
