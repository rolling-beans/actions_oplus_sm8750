          echo "CONFIG_BBG=y" >> ./common/arch/arm64/configs/gki_defconfig
          cd ./common
          curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: 📦 Add build name
        run: |
          cd kernel_workspace
          sudo sed -i "s/-4k/-palaziks-ShiftPorts/g" ./common/arch/arm64/configs/gki_defconfig
          sed -i 's/${scm_version}//' ./common/scripts/setlocalversion
          echo "CONFIG_LOCALVERSION_AUTO=n" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 🔨 Build Kernel
        run: |
          WORKDIR="$(pwd)"
          export MAP="-fdebug-prefix-map=${GITHUB_WORKSPACE}=. -fmacro-prefix-map=${GITHUB_WORKSPACE}=. -ffile-prefix-map=${GITHUB_WORKSPACE}=."
          export PATH="$WORKDIR/kernel_workspace/clang-r563880c/bin:$WORKDIR/kernel_workspace/build-tools/linux-x86/bin:$PATH"
          CLANG_DIR="$WORKDIR/kernel_workspace/clang-r563880c/bin"
          echo "Clang: $($CLANG_DIR/clang --version | head -n 1)"
          echo "LLD:   $($CLANG_DIR/ld.lld --version | head -n 1)"
          pahole --version 2>/dev/null || echo "Pahole: Not Installed"

          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_IS_KERNEL_COMPILING=true

          mkdir -p $GITHUB_WORKSPACE/kout
          mkdir -p "$LDCACHE_DIR"

          cd kernel_workspace/common
          set -o pipefail
          : > /tmp/kbuild.log

          echo '#!/bin/bash' > ld-wrapper
          echo 'ld.lld "$@" --thinlto-cache-dir=$LDCACHE_DIR --thinlto-jobs=$(($(nproc --all) / 2))' >> ld-wrapper
          chmod +x ld-wrapper

          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfakestat.so || true
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfaketimeMT.so || true
          chmod 777 ./*.so || true
          SO_DIR=$(pwd)
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"

          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="$(pwd)/ld-wrapper" HOSTLD="$(pwd)/ld-wrapper" \
            O=$GITHUB_WORKSPACE/kout \
            KCFLAGS="-O2 -pipe -Wno-error -Wno-implicit-function-declaration -Wno-implicit-int -Wno-default-const-init-var-unsafe -Wno-format -Wno-unknown-warning-option"\
            gki_defconfig 2>&1 | tee -a /tmp/kbuild.log

          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="$(pwd)/ld-wrapper" HOSTLD="$(pwd)/ld-wrapper" \
            O=$GITHUB_WORKSPACE/kout \
            KCFLAGS="-O2 -pipe -Wno-error -Wno-implicit-function-declaration -Wno-implicit-int -Wno-default-const-init-var-unsafe -Wno-format -Wno-unknown-warning-option ${AFDO_CFLAGS:-} ${EXTRA_CFLAGS:-} ${MAP}" \
            Image 2>&1 | tee -a /tmp/kbuild.log

          echo "Kernel Compilation Complete!"
          ccache -c
          ccache --evict-older-than 10800s
          echo "CCache Status:"
          ccache -s
          df -h

      - name: 🧩 Build Kasumi LKM
        if: inputs.ksumi_lkm
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel_workspace

          echo "📦 Cloning Kasumi..."
          rm -rf kasumi
          git clone --depth=1 https://github.com/Rouyashiki/Kasumi.git kasumi

          echo "🔧 Preparing the same AOSP toolchain used for the 6.6.143 kernel..."
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang-r563880c/bin:$GITHUB_WORKSPACE/kernel_workspace/build-tools/linux-x86/bin:$PATH"
          CLANG_DIR="$GITHUB_WORKSPACE/kernel_workspace/clang-r563880c/bin"
          echo "Clang: $($CLANG_DIR/clang --version | head -n 1)"
          echo "LLD:   $($CLANG_DIR/ld.lld --version | head -n 1)"

          # Each GitHub Actions step has its own shell, so the ld-wrapper
          # created by the kernel build step is not guaranteed to exist here.
          cat > "$GITHUB_WORKSPACE/kernel_workspace/ld-wrapper" <<'EOF'
          #!/bin/bash
          exec ld.lld "$@" --thinlto-cache-dir=$LDCACHE_DIR --thinlto-jobs=$(($(nproc --all) / 2))
          EOF
          chmod +x "$GITHUB_WORKSPACE/kernel_workspace/ld-wrapper"

          # The kernel workflow builds only Image. Prepare the output tree
          # for an external module; Linux 6.6 generates scripts/module.lds
          # through modules_prepare, which is required by the final module link.
          echo "🔧 Preparing kernel tree for external modules..."
          make -C common \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            O=$GITHUB_WORKSPACE/kout \
            modules_prepare

          if [ ! -s "$GITHUB_WORKSPACE/kout/scripts/module.lds" ]; then
            echo "::error::kout/scripts/module.lds was not generated by modules_prepare"
            exit 1
          fi

          # The kernel workflow does not build in-tree modules, so the external
          # module's Module.symvers is absent. vmlinux.symvers is generated
          # during the vmlinux link and contains the exported kernel symbols
          # required by modpost for Kasumi.
          if [ ! -s "$GITHUB_WORKSPACE/kout/Module.symvers" ]; then
            if [ ! -s "$GITHUB_WORKSPACE/kout/vmlinux.symvers" ]; then
              echo "::error::Neither kout/Module.symvers nor kout/vmlinux.symvers exists"
              exit 1
            fi
            cp "$GITHUB_WORKSPACE/kout/vmlinux.symvers" \
               "$GITHUB_WORKSPACE/kout/Module.symvers"
            echo "✅ Prepared kout/Module.symvers from kout/vmlinux.symvers"
          fi

          echo "🔧 Building Kasumi against the prepared 6.6.143 kernel..."
          set -o pipefail
          make -C common \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            LD="$GITHUB_WORKSPACE/kernel_workspace/ld-wrapper" \
            HOSTLD="$GITHUB_WORKSPACE/kernel_workspace/ld-wrapper" \
            O=$GITHUB_WORKSPACE/kout \
            M=$GITHUB_WORKSPACE/kernel_workspace/kasumi/src \
            modules 2>&1 | tee -a /tmp/kasumi-kbuild.log

          KASUMI_KO="$GITHUB_WORKSPACE/kernel_workspace/kasumi/src/kasumi_lkm.ko"
          if [ ! -f "$KASUMI_KO" ]; then
            echo "::error::Kasumi module was not produced: $KASUMI_KO"
            find "$GITHUB_WORKSPACE/kernel_workspace/kasumi/src" -maxdepth 1 -type f -name '*.ko' -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/kasumi-artifact"
          cp "$KASUMI_KO" "$GITHUB_WORKSPACE/kasumi-artifact/kasumi_lkm.ko"
          cp "$GITHUB_WORKSPACE/kernel_workspace/kasumi/src/Module.symvers" "$GITHUB_WORKSPACE/kasumi-artifact/" 2>/dev/null || true

          echo "✅ Kasumi LKM built successfully:"
          ls -lh "$GITHUB_WORKSPACE/kasumi-artifact/"
          file "$GITHUB_WORKSPACE/kasumi-artifact/kasumi_lkm.ko"

      - name: 📦 Save New CCache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: 📦 Save LTO CCache
        if: success() && inputs.lto_type == 'thin'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LDCACHE_DIR }}
          key: lto-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: 🧠 Package AK3 ZIP
        id: create_zip
        run: |
          cd kernel_workspace
          git clone https://github.com/palazik/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp $GITHUB_WORKSPACE/kout/arch/arm64/boot/Image ./Image
          if [[ ! -f ./Image ]]; then
            echo "Kernel Image not found, build may have failed."
            exit 1
          fi
          case "${{ inputs.ksu_type }}" in
            "SukiSU Ultra") KSU_TYPENAME="SukiSU-Ultra" ;;
            "KernelSU Next") KSU_TYPENAME="KSUNext" ;;
            *) KSU_TYPENAME="${{ inputs.ksu_type }}" ;;
          esac
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            wget https://raw.githubusercontent.com/$GITHUB_REPOSITORY/refs/heads/$GITHUB_REF_NAME/zram.zip || true
          fi
          AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_FULL_VERSION }}_palaziks_AOSP-ShiftPorts.zip
          FULL_VERSION=${{ env.KERNEL_FULL_VERSION }}-palaziks_AOSP-ShiftPorts
          zip -r ../$AK3_NAME ./*
          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT

          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "Author: $GITHUB_ACTOR" > ./ak3.log
          echo "Repo: $GITHUB_REPOSITORY" >> ./ak3.log
          echo "Branch: $GITHUB_REF_NAME" >> ./ak3.log
          echo "Run ID: $GITHUB_RUN_ID" >> ./ak3.log
          echo "Commit: $GITHUB_SHA" >> ./ak3.log
          echo "Time: $TIME_NOW" >> ./ak3.log
          echo "Kernel Ver: $FULL_VERSION" >> ./ak3.log
          echo "KSU Branch: ${KSU_TYPENAME}" >> ./ak3.log
          echo "KSU Ver: ${KSUVER}" >> ./ak3.log
          echo "SuSFS: ${{ github.event.inputs.SUSFS }}" >> ./ak3.log
          echo "LZ4: ${{ github.event.inputs.lz4_enable }}" >> ./ak3.log
          echo "LZ4KD: ${{ github.event.inputs.lz4kd_enable }}" >> ./ak3.log
          echo "BBR&Brutal: ${{ github.event.inputs.bbr_enable }}" >> ./ak3.log
          echo "BBRv3: true (stock)" >> ./ak3.log
          echo "ADIOS: ${{ github.event.inputs.adios_enable }}" >> ./ak3.log
          echo "Re-Kernel: ${{ github.event.inputs.rekernel_enable }}" >> ./ak3.log
          echo "BBG: ${{ github.event.inputs.baseband_guard }}" >> ./ak3.log
          echo "NTSync: ${{ github.event.inputs.ntsync_enable }}" >> ./ak3.log
          echo "Droidspaces: ${{ github.event.inputs.droidspaces_enable }}" >> ./ak3.log
          echo "IP_SET+IPv6NAT: ${{ github.event.inputs.ip_set_enable }}" >> ./ak3.log
          echo "TTL: ${{ github.event.inputs.ttl_enable }}" >> ./ak3.log
          echo "MemOpt: ${{ github.event.inputs.mem_opt_patches }}" >> ./ak3.log
          echo "BORE: ${{ github.event.inputs.bore_enable }}" >> ./ak3.log
          zip -z ../$AK3_NAME < ./ak3.log

      - name: 📤 Upload Kasumi LKM
        if: inputs.ksumi_lkm
        uses: actions/upload-artifact@v4
        with:
          name: kasumi-lkm-${{ env.KERNEL_FULL_VERSION }}
          path: |
            ${{ github.workspace }}/kasumi-artifact/kasumi_lkm.ko
            ${{ github.workspace }}/kasumi-artifact/Module.symvers

      - name: 📤 Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_zip.outputs.ak3name }}
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip

      - name: 📝 Make ZRAM module
        run: |
          ZRAM_KO=$(find $GITHUB_WORKSPACE/kout -name "zram.ko" | head -1)
          if [ -z "$ZRAM_KO" ]; then
            echo "⚠️ zram.ko not found, skipping"
            exit 0
          fi
          curl -L "https://github.com/cctv18/oppo_oplus_realme_sm8750/raw/refs/heads/main/zram.zip" -o zram.zip
          unzip -q zram.zip -d zram
          find zram -name "zram.ko" -exec cp "$ZRAM_KO" {} \;
          rm -f zram.zip
          echo "✅ Done!"

      - name: 📤 Upload zram.zip
        uses: actions/upload-artifact@v4
        with:
          name: zram-module
          path: ./zram/*

      - name: Send Telegram Notification (Success)
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +"%Y-%m-%d %H:%M:%S %Z")
          COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-8)
          COMMIT_MSG="Workflow Dispatch: ${{ env.KERNEL_FULL_VERSION }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"


          CAPTION="✅ <b>Kernel Build Successful!</b>

          📱 <b>Device:</b> <code>OnePlus 13 AOSP</code>
          ⚡ <b>KSU:</b> <code>${{ inputs.ksu_type }}</code>
          📅 <b>Date:</b> $DATE
          📝 <b>Commit:</b> <code>$COMMIT_MSG</code>
          🔢 <b>Hash:</b> <a href=\"$REPO_URL/commit/${{ github.sha }}\">$COMMIT_HASH</a>
          🔧 <b>Kernel features:</b> see workflow configuration"

          ZIP_PATH=$(ls ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip | head -n 1)
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F document="@$ZIP_PATH" \
            -F caption="$CAPTION" \
            -F parse_mode="HTML"

      - name: Send Telegram Notification (Failure)
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +"%Y-%m-%d %H:%M:%S %Z")
          COMMIT_MSG="Workflow Dispatch: ${{ env.KERNEL_FULL_VERSION }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          CAPTION="❌ <b>Kernel Build Failed!</b>

          📱 <b>Device:</b> <code>OnePlus 13 AOSP</code>
          ⚡ <b>KSU:</b> <code>${{ inputs.ksu_type }}</code>
          📅 <b>Date:</b> $DATE
          📝 <b>Commit:</b> <code>$COMMIT_MSG</code>
          🔢 <b>Hash:</b> <a href=\"$REPO_URL/commit/${{ github.sha }}\">$(echo "${{ github.sha }}" | cut -c1-8)</a>"

          if [ -s /tmp/kbuild.log ]; then
            tail -n 3000 /tmp/kbuild.log > /tmp/kbuild_tail.log
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
              -F chat_id="$TELEGRAM_CHAT_ID" \
              -F document="@/tmp/kbuild_tail.log" \
              -F caption="$CAPTION" \
              -F parse_mode="HTML"
          else
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="$CAPTION" \
              -d parse_mode="HTML"
          fi

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: Download ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: ./release_zips

      - name: Set Environment Variables
        run: |
          FULL_VERSION=${{ env.KERNEL_FULL_VERSION }}-palaziks_AOSP-ShiftPorts
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          TAG_HEAD="OPPO-OPlus-Realme-build"
          echo "TAG_HEAD=$TAG_HEAD" >> $GITHUB_ENV
          echo "KSU_TYPENAME=${{ inputs.ksu_type }}" >> $GITHUB_ENV

      - name: Create Release
        if: ${{ github.event.inputs.github_release == 'true' }}
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 OnePlus 13 ${{ inputs.ksu_type }} SM8750 AOSP Clang
          > ⚠️ **ROM Compatibility:** Built with **AOSP Clang** for **AOSP-based ROMs** only. To flash on **ColorOS / OxygenOS**, run the `OP13 Kernel Build` workflow yourself (ZyCromerZ Clang builds are for ColorOS / OxygenOS only).

          - **Kernel Version:** ${{ env.FULL_VERSION }}
          - **Build Time:** ${{ env.TIME_FORM }}
          - **KSU Branch:** ${{ inputs.ksu_type }}
          - **SuSFS:** ${{ github.event.inputs.SUSFS }}
          - **NTSync:** ${{ github.event.inputs.ntsync_enable }}
          - **Droidspaces:** ${{ github.event.inputs.droidspaces_enable }}
          - **IP_SET + IPv6 NAT:** ${{ github.event.inputs.ip_set_enable }}
          - **TTL Target:** ${{ github.event.inputs.ttl_enable }}
          - **Memory & Scheduler Optimizations:** ${{ github.event.inputs.mem_opt_patches }}
          - **Multi-Manager:** true
          - **LZ4:** ${{ github.event.inputs.lz4_enable }}
          - **LZ4KD:** ${{ github.event.inputs.lz4kd_enable }}
          - **BTF + eBPF + FUSE-BPF:** ${{ github.event.inputs.bpf_stack_enable }}
          - **BBR/Brutal:** ${{ github.event.inputs.bbr_enable }}
          - **BBRv3:** true (stock)
          - **ADIOS IO:** ${{ github.event.inputs.adios_enable }}
          - **Baseband Guard:** ${{ github.event.inputs.baseband_guard }}
          - **Fengchi:** ${{ github.event.inputs.fengchi }}
          - **Oryon CPU Optimizations:** ${{ github.event.inputs.cpu_opt }}
          - **Unicode Fix:** true (stock)
          - **BORE Scheduler:** ${{ github.event.inputs.bore_enable }}
          - **WireGuard:** ${{ github.event.inputs.wireguard }}
          - **LRNG v60:** ${{ github.event.inputs.lrng_enable }}
          - **Wakelock Blocker:** ${{ github.event.inputs.wakelock_blocker }}
          EOF

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-${{ env.FULL_VERSION }}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip
\\n'}"
            TOKEN_BODY="${TOKEN_RESPONSE%
          
          if [ -n "$AFDO_CFLAGS" ]; then
            echo "AFDO_CFLAGS=$AFDO_CFLAGS" >> "$GITHUB_ENV"
            echo "✅ AFDO enabled"
          else
            echo "AFDO_CFLAGS=" >> "$GITHUB_ENV"
            echo "⚠️ AFDO unavailable; continuing without AFDO optimization"
          fi
          
          unset AFDO_ACCESS_TOKEN
          rm -f "$AFDO_B64"
          
          echo "Source and tools initialized successfully!"

      - name: Cache ccache-ECS binary
        uses: actions/cache@v4
        id: ecs-cache
        with:
          path: /tmp/ccache-ecs-bin
          key: ccache-ecs-${{ runner.os }}-084a7620

      - name: Build & Install ccache-ECS
        run: |
          if [ -f /tmp/ccache-ecs-bin/ccache ]; then
            echo "ECS binary cached, skipping build"
            sudo cp /tmp/ccache-ecs-bin/ccache /usr/local/bin/ccache
          else
            sudo apt-get install -y --no-install-recommends cmake
            git clone --depth=1 https://github.com/cctv18/ccache-ECS.git /tmp/ccache-ecs
            cd /tmp/ccache-ecs
            ./ci/build-binary
            mkdir -p /tmp/ccache-ecs-bin
            cp install/ccache /tmp/ccache-ecs-bin/ccache
            sudo cp /tmp/ccache-ecs-bin/ccache /usr/local/bin/ccache
          fi
          sudo chmod 755 /usr/local/bin/ccache
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "✅ ECS ccache: $(/usr/local/bin/ccache --version | head -1)"

      - name: Save ccache-ECS binary cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/ccache-ecs-bin
          key: ccache-ecs-${{ runner.os }}-084a7620

      - name: Configure CCache Directory
        run: |
          echo "CCACHE_KEY=ccache-neov4-${{ env.KERNEL_FULL_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_FULL_VERSION }}" >> $GITHUB_ENV
          echo "LDCACHE_DIR=$GITHUB_WORKSPACE/ldcache_${{ env.KERNEL_FULL_VERSION }}" >> $GITHUB_ENV
          mkdir -p $GITHUB_WORKSPACE/ldcache_${{ env.KERNEL_FULL_VERSION }}
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV
          echo "Current Disk Space:"
          df -h
          echo "Current Build Kernel Version: ${{ env.KERNEL_FULL_VERSION }}"

      - name: Restore CCache
        uses: actions/cache/restore@v4
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_KEY }}-

      - name: Restore LTO Cache
        uses: actions/cache/restore@v4
        if: inputs.lto_type == 'thin'
        with:
          path: ${{ env.LDCACHE_DIR }}
          key: lto-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            lto-cache-${{ runner.os }}-${{ github.ref_name }}-

      - name: Init and Config CCache
        run: |
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          mkdir -p "$CCACHE_DIR"

          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -o compression=true
          ccache -o compiler_check=none
          ccache -o hash_dir=false
          ccache -o direct_mode=true
          ccache -o depend_mode=false
          ccache -o base_dir="${{ github.workspace }}"
          ccache -o sloppiness=file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros,locale

          echo "Initial CCache status:"
          ccache -s

          echo "Updating atime to achieve cache eviction..."
          find "${{ env.CCACHE_DIR }}" -type f -exec touch -t $(date -d "1 day ago" +%Y%m%d%H%M) {} + || true

      - name: ⚡ Setup ReSukiSU
        if: inputs.ksu_type == 'ReSukiSU'
        run: |
          cd kernel_workspace/common
          echo "🛠️ Setting up ReSukiSU (main)..."
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main
          cd KernelSU
          KSU_VERSION_COUNT=$(git rev-list --count HEAD)
          export KSUVER=$(expr $KSU_VERSION_COUNT + 37185)
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV
          echo "✅ ReSukiSU $(git rev-parse --short HEAD) (ver $KSUVER)"

      - name: ⚡ Setup SukiSU Ultra
        if: inputs.ksu_type == 'SukiSU Ultra'
        run: |
          cd kernel_workspace/common
          echo "🛠️ Setting up SukiSU Ultra (builtin)..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh" | bash -s builtin
          cd KernelSU
          KSU_VERSION_COUNT=$(git rev-list --count HEAD)
          export KSUVER=$(expr $KSU_VERSION_COUNT + 37185)
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV
          KSU_API_VERSION=$(grep -E "^KSU_VERSION[[:space:]]*=" "../Makefile" | cut -d'=' -f2 | tr -d '[:space:]')
          [ -z "$KSU_API_VERSION" ] && KSU_API_VERSION="12800"
          KSU_COMMIT_HASH=$(git rev-parse --short=8 HEAD)
          KBUILD_FILE="kernel/Makefile"
          [ -f "kernel/Kbuild" ] && KBUILD_FILE="kernel/Kbuild"
          sed -i 's/-DKSU_VERSION_FULL=[^ ]*//g' "$KBUILD_FILE"
          sed -i '/KSU_VERSION_FULL/d' "$KBUILD_FILE"
          cat >> "$KBUILD_FILE" <<EOF
          ccflags-y += -DKSU_VERSION_FULL=\"v${KSU_API_VERSION}-${KSU_COMMIT_HASH}@palaziks\"
          EOF
          echo "✅ SukiSU $KSUVER (v${KSU_API_VERSION}-${KSU_COMMIT_HASH}@palaziks)"

      - name: ⚡ Setup KernelSU
        if: inputs.ksu_type == 'KernelSU'
        run: |
          cd kernel_workspace/common
          echo "🛠️ Setting up KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          cd KernelSU
          git fetch --force origin main
          git checkout -B main origin/main
          KSU_GIT_VERSION=$(git rev-list --count origin/main)
          export KSUVER=$(expr 10000 + $KSU_GIT_VERSION + 200)
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV
          echo "✅ KernelSU $(git describe --tags 2>/dev/null || git rev-parse --short HEAD)  (ver $KSUVER)"

      - name: ⚡ Setup KernelSU Next
        if: inputs.ksu_type == 'KernelSU Next'
        run: |
          cd kernel_workspace/common
          echo "🛠️ Setting up KernelSU-Next (dev branch)..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev
          cd KernelSU-Next
          KSU_GIT_VERSION=$(git rev-list --count HEAD)
          export KSUVER=$(expr 10000 + $KSU_GIT_VERSION + 200)
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV
          echo "✅ KernelSU-Next $(git describe --tags 2>/dev/null || git rev-parse --short HEAD)  (ver $KSUVER)"

      - name: 🔧 Setup Patches
        run: |
          cd kernel_workspace
          if [ "${{ github.event.inputs.SUSFS }}" == "true" ]; then
            git clone --depth=1 -b gki-android15-6.6 https://gitlab.com/simonpunk/susfs4ksu.git &
          fi
          git clone --depth=1 https://github.com/mrcxlinux/kernel_patches.git &
          git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git &
          git clone --depth=1 https://github.com/palazik/kernel_patches.git wildkernels_patches &
          wait

          if [ "${{ github.event.inputs.SUSFS }}" == "true" ]; then
            cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch ./common/
            cp susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          fi

          cd ./common
          cp ../kernel_patches/common/EnablePOLLY.patch ./
          git apply -p1 < EnablePOLLY.patch || true
          echo "✅ Base patches applied"

      - name: 📦 Apply SUSFS (ReSukiSU / SukiSU Ultra)
        if: inputs.SUSFS && (inputs.ksu_type == 'ReSukiSU' || inputs.ksu_type == 'SukiSU Ultra')
        working-directory: kernel_workspace/common
        run: |
          echo "📦 Pre-patch fixups (fatalcoder android15-6.6 method)..."
          if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
            sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' \
                   -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
          fi
          if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
          fi
          if ! grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then
            sed -i '/#include <linux\/sched\/sysctl\.h>/a #include <linux\/zswap.h>' ./mm/memory.c
          fi
          if grep -qF 'if (vma->vm_end > last_vma_end)' ./fs/proc/task_mmu.c \
             && ! grep -qF 'if (vma->vm_end > last_vma_end) {' ./fs/proc/task_mmu.c; then
            perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\)\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);/\t\t\tif (vma->vm_end > last_vma_end) {\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t}/' ./fs/proc/task_mmu.c
          fi

          echo "📦 Applying 50_ with --forward (by-design rejects skip cleanly)..."
          patch -p1 --forward < 50_add_susfs_in_gki-android15-6.6.patch || true

          grep -q "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))" fs/proc/task_mmu.c \
            || { echo "❌ SUS_MAP guard missing — real failure"; exit 1; }
          echo "✅ SUSFS applied (fatalcoder method)"

      - name: 📦 Apply SUSFS (KernelSU)
        if: inputs.SUSFS && inputs.ksu_type == 'KernelSU'
        working-directory: kernel_workspace/common
        run: |
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
          echo "📦 Enabling SUSFS inside KernelSU..."
          ( cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch )
          echo "📦 Applying SUSFS kernel patch..."
          patch -p1 < 50_add_susfs_in_gki-android15-6.6.patch

      - name: 📦 Apply SUSFS (KernelSU Next)
        if: inputs.SUSFS && inputs.ksu_type == 'KernelSU Next'
        working-directory: kernel_workspace/common
        run: |
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU-Next/
          FIX_DIR="../wildkernels_patches/next/susfs_fix_patches/v2.2.0"

          echo "📦 [1/3] Applying 10_enable_susfs_for_ksu (KSUN-specific rejects are expected)..."
          ( cd KernelSU-Next && patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true )

          echo "📦 [2/3] Applying WildKernels KSUN fix patches (v2.2.0)..."
          for p in \
            fix_Kbuild.patch \
            fix_init.c.patch \
            fix_kernel_umount.c.patch \
            fix_setuid_hook.c.patch \
            fix_sucompat.c.patch \
            fix_supercall.c.patch \
            ksu_toolkit.patch \
            overwrite_hook_mode.patch; do
            if [ -f "$FIX_DIR/$p" ]; then
              ( cd KernelSU-Next && patch -p1 --forward < "../$FIX_DIR/$p" ) \
                && echo "  ✅ $p" || echo "  ⚠️ $p (skipped/conflict)"
            else
              echo "  ⚠️ $p not found"
            fi
          done

          echo "📦 [3/3] Applying 50_add_susfs kernel patch..."
          patch -p1 < 50_add_susfs_in_gki-android15-6.6.patch

      - name: ⚙️ Configure Kernel Options
        run: |
          cd kernel_workspace
          DEFCONFIG="./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          case "${{ inputs.ksu_type }}" in
            "ReSukiSU")
              echo 'CONFIG_KSU_FULL_NAME_FORMAT="v%KSU_VERSION%-%COMMIT_SHA%@palaziks"' >> "$DEFCONFIG"
              ;;
            "SukiSU Ultra")
              echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"
              ;;
            "KernelSU")
              echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
              echo "CONFIG_HAVE_KPROBES=y" >> "$DEFCONFIG"
              echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"
              ;;
            "KernelSU Next")
              echo "CONFIG_EXT4_FS=y" >> "$DEFCONFIG"
              ;;
          esac
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
          echo "CONFIG_CIFS=y" >> "$DEFCONFIG"
          echo "CONFIG_NETWORK_FILESYSTEMS=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFS_SUPPORT=y" >> "$DEFCONFIG"
          echo "CONFIG_KEYS=y" >> "$DEFCONFIG"
          echo "CONFIG_CIFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_CIFS_POSIX=y" >> "$DEFCONFIG"
          echo "CONFIG_NET_SCH_FQ=y" >> "$DEFCONFIG"
          echo "CONFIG_NET_SCH_FQ_CODEL=y" >> "$DEFCONFIG"
          echo "CONFIG_NET_SCH_CAKE=y" >> "$DEFCONFIG"
          echo "CONFIG_NET_ACT_CONNMARK=y" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_BIC=y" >> "$DEFCONFIG"

          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            echo "CONFIG_ZSMALLOC=y" >> "$DEFCONFIG"
            echo "CONFIG_CRYPTO_LZ4HC=y" >> "$DEFCONFIG"
            echo "CONFIG_CRYPTO_LZ4K=y" >> "$DEFCONFIG"
            echo "CONFIG_CRYPTO_LZ4KD=y" >> "$DEFCONFIG"
            echo "CONFIG_CRYPTO_842=y" >> "$DEFCONFIG"
          fi

          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$DEFCONFIG"
          sed -i 's/check_defconfig//' ./common/build.config.gki
          echo "CONFIG_HEADERS_INSTALL=n" >> "$DEFCONFIG"

          echo "CONFIG_LLVM_POLLY=y" >> "$DEFCONFIG"
          if [[ "${{ inputs.bpf_stack_enable }}" == "true" ]]; then
            echo "📦 Enabling BTF/eBPF/FUSE-BPF stack..."
            echo "CONFIG_DEBUG_INFO_BTF=y" >> "$DEFCONFIG"
            echo "CONFIG_BPF_EVENTS=y" >> "$DEFCONFIG"
            echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"
            echo "CONFIG_UPROBES=y" >> "$DEFCONFIG"
            echo "CONFIG_UPROBE_EVENTS=y" >> "$DEFCONFIG"
            echo "CONFIG_FUSE_FS=y" >> "$DEFCONFIG"
            echo "CONFIG_BPF_SYSCALL=y" >> "$DEFCONFIG"
            echo "CONFIG_FUSE_BPF=y" >> "$DEFCONFIG"
            echo "CONFIG_BPF=y" >> "$DEFCONFIG"
            echo "CONFIG_BPF_JIT=y" >> "$DEFCONFIG"
            echo "CONFIG_CGROUP_BPF=y" >> "$DEFCONFIG"
            echo "CONFIG_CGROUP_BPF=y" >> "$DEFCONFIG"
            echo "CONFIG_NET_CLS_ACT=y" >> "$DEFCONFIG"
            echo "CONFIG_NET_ACT_BPF=y" >> "$DEFCONFIG"
            echo "CONFIG_FUSE_FS=y" >> "$DEFCONFIG"
            echo "CONFIG_FUSE_PASSTHROUGH=y" >> "$DEFCONFIG"
          else
            echo "BTF/eBPF/FUSE-BPF stack disabled"
          fi

          echo "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y" >> "$DEFCONFIG"

          if [ "${{ github.event.inputs.SUSFS }}" == "true" ]; then
            echo "📦 Enabling SUSFS features..."
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$DEFCONFIG"
            case "${{ inputs.ksu_type }}" in
              "SukiSU Ultra")
                echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$DEFCONFIG"
                echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$DEFCONFIG"
                echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$DEFCONFIG"
                echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$DEFCONFIG"
                echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "$DEFCONFIG"
                echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> "$DEFCONFIG"
                echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> "$DEFCONFIG"
                ;;
              "KernelSU Next")
                echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$DEFCONFIG"
                ;;
            esac
          fi

      - name: ⚡ Setup NoMount
        run: |
          cd kernel_workspace/common
          echo "🛠️ Setting up NoMount (builtin)..."
          curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -


      - name: Apply LZ4 1.10.0 & ZSTD 1.5.7 Patches
        if: inputs.lz4_enable
        run: |
          echo "Adding LZ4 & ZSTD patches..."
          cd kernel_workspace/common

          cp ../kernel_patches/zram/001-lz4.patch ./
          cp ../kernel_patches/zram/002-zstd.patch ./

          # 001-lz4.patch requires a terminating empty line after GIT binary patch
          printf '\n' >> 001-lz4.patch

          # Existing OnePlus source has an extra export which conflicts with 001-lz4.patch
          sed -i '/^EXPORT_SYMBOL(LZ4_resetStreamHC);$/d' lib/lz4/lz4hc_compress.c

          git apply -p1 < 001-lz4.patch

          # 002-zstd.patch contains one obsolete x86-only hunk in
          # lib/zstd/common/portability_macros.h. Remove only that hunk.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("002-zstd.patch")
          s = p.read_text()

          start = (
              "diff --git a/lib/zstd/common/portability_macros.h "
              "b/lib/zstd/common/portability_macros.h"
          )
          pos = s.index(start)

          next_file = s.find("\ndiff --git ", pos + len(start))
          if next_file == -1:
              next_file = len(s)

          block = s[pos:next_file]

          hunk_start = block.index("@@ -45,30 +46,35 @@")
          next_hunk = block.find("\n@@ ", hunk_start + 1)

          if next_hunk == -1:
              raise RuntimeError("Could not locate end of portability_macros.h hunk #3")

          block = block[:hunk_start] + block[next_hunk + 1:]
          s = s[:pos] + block + s[next_file:]

          p.write_text(s)
          PY

          patch -p1 < 002-zstd.patch

          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "ERROR: patch rejects found"
            find . -name '*.rej' -print
            exit 1
          fi

      - name: Apply LZ4KD Patch
        if: inputs.lz4kd_enable
        run: |
          echo "Adding LZ4KD patch..."
          cd kernel_workspace/common
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./lib
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto
          cp ../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
          patch -p1 -F 3 < lz4kd.patch
          
      - name: ⚙️ Configure Fengchi (HMBIRD)
        working-directory: kernel_workspace/common
        run: |
          DEFCONFIG=arch/arm64/configs/gki_defconfig
          sed -i '/^CONFIG_HMBIRD_SCHED=/d; /^# CONFIG_HMBIRD_SCHED is not set/d' "$DEFCONFIG"
          if [ "${{ inputs.fengchi }}" == "true" ]; then
            if [ ! -d kernel/sched/hmbird ]; then
              echo "::error::kernel/sched/hmbird is missing from the kernel source"
              exit 1
            fi
            echo "CONFIG_HMBIRD_SCHED=y" >> "$DEFCONFIG"
            echo "✅ Fengchi enabled"
          else
            echo "CONFIG_HMBIRD_SCHED=n" >> "$DEFCONFIG"
            echo "Fengchi disabled"
          fi

      - name: Prepare CPU Optimizations (Oryon SM8750)
        if: inputs.cpu_opt
        run: |
          echo "EXTRA_CFLAGS=-mcpu=oryon-1" >> $GITHUB_ENV
          echo "✅ Oryon flags prepared."

      - name: Apply Unicode Bypass Fix
        working-directory: kernel_workspace/common
        run: |
          PATCH_URL="https://github.com/palazik/kernel_patches/raw/main/common/unicode_bypass_fix_6.1+.patch"
          wget -qO /tmp/ub_fix.patch "$PATCH_URL" 2>/dev/null && \
            patch -p1 --forward < /tmp/ub_fix.patch || true
          echo "Unicode fix applied"

      - name: Apply BORE Scheduler
        if: inputs.bore_enable
        working-directory: kernel_workspace/common
        run: |
          echo "CONFIG_SCHED_BORE=y" >> arch/arm64/configs/gki_defconfig
          BORE_URL="https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/patches/bore.patch"
          wget -qO /tmp/bore.patch "$BORE_URL"
          patch -p1 -F 3 < /tmp/bore.patch
          echo "✅ BORE scheduler applied"

      - name: Apply Memory & Scheduler Optimization Patches
        if: inputs.mem_opt_patches
        working-directory: kernel_workspace/common
        run: |
          echo "Applying WildKernels optimization patches..."
          PATCHES_DIR="../wildkernels_patches/common"

          apply_patch() {
            local patch="$1"
            if [ -f "$PATCHES_DIR/$patch" ]; then
              patch -p1 --forward < "$PATCHES_DIR/$patch" && \
                echo "✅ $patch" || echo "⚠️ $patch (skipped/conflict)"
            else
              echo "⚠️ $patch not found, skipping"
            fi
          }

          apply_patch "optimized_mem_operations.patch"
          apply_patch "file_struct_8bytes_align.patch"
          apply_patch "reduce_cache_pressure.patch"
          apply_patch "mem_opt_prefetch.patch"
          apply_patch "optimise_memcmp.patch"
          apply_patch "minimise_wakeup_time.patch"
          apply_patch "int_sqrt.patch"
          apply_patch "reduce_gc_thread_sleep_time.patch"
          apply_patch "add_timeout_wakelocks_globally.patch"
          apply_patch "f2fs_reduce_congestion.patch"
          apply_patch "reduce_freeze_timeout.patch"
          apply_patch "clear_page_16bytes_align.patch"
          apply_patch "add_limitation_scaling_min_freq.patch"
          apply_patch "re_write_limitation_scaling_min_freq.patch"
          apply_patch "adjust_cpu_scan_order.patch"
          apply_patch "avoid_extra_s2idle_wake_attempts.patch"
          apply_patch "disable_cache_hot_buddy.patch"
          apply_patch "f2fs_enlarge_min_fsync_blocks.patch"
          apply_patch "increase_ext4_default_commit_age.patch"
          apply_patch "increase_sk_mem_packets.patch"
          apply_patch "reduce_pci_pme_wakeups.patch"
          apply_patch "silence_irq_cpu_logspam.patch"
          apply_patch "silence_system_logspam.patch"
          apply_patch "use_unlikely_wrap_cpufreq.patch"

          echo "✅ Optimization patches applied"

      - name: Apply NTSync Patch
        if: inputs.ntsync_enable
        working-directory: kernel_workspace/common
        run: |
          echo "Enabling NTSync (NT kernel sync primitives)..."
          NTSYNC_DIR="../wildkernels_patches/common/ntsync"

          NTSYNC_PATCH=""
          for candidate in \
            "$NTSYNC_DIR/ntsync_compat_android15-6.6.patch" \
            "$NTSYNC_DIR/ntsync_compat_android15-6.6_OOS16.patch" \
            "$NTSYNC_DIR/ntsync_compat_android15-6.6_OOS15.patch"; do
            if [ -f "$candidate" ]; then
              NTSYNC_PATCH="$candidate"
              break
            fi
          done

          if [ -z "$NTSYNC_PATCH" ]; then
            echo "⚠️ NTSync compat patch for android15-6.6 not found in wildkernels_patches."
            echo "   Falling back to upstream ntsync driver (mainline backport)..."
            if [ -f "$NTSYNC_DIR/ntsync_base.patch" ]; then
              patch -p1 --forward < "$NTSYNC_DIR/ntsync_base.patch" || true
            else
              echo "::warning::NTSync base patch also not found. Skipping NTSync."
              exit 0
            fi
          else
            echo "Using: $(basename $NTSYNC_PATCH)"
            patch -p1 --forward < "$NTSYNC_PATCH" || true
            if [ -f "$NTSYNC_DIR/ntsync_base.patch" ]; then
              patch -p1 --forward < "$NTSYNC_DIR/ntsync_base.patch" || true
            fi
          fi

          echo "CONFIG_NTSYNC=y" >> arch/arm64/configs/gki_defconfig
          echo "✅ NTSync enabled"

      - name: Add Droidspaces Support
        if: inputs.droidspaces_enable
        working-directory: kernel_workspace/common
        run: |
          echo "Enabling Droidspaces (portable Linux containers)..."
          DS_DIR="../wildkernels_patches/common/droidspaces"

          if [ -f "$DS_DIR/fix_sysvipc_kabi_6_7_8.patch" ]; then
            patch -p1 --forward < "$DS_DIR/fix_sysvipc_kabi_6_7_8.patch" || true
          else
            echo "⚠️ fix_sysvipc_kabi_6_7_8.patch not found, skipping KABI fix"
          fi

          if [ -f "$DS_DIR/0001-Return-ghost-task-if-task-is-null-and-is-requested-b.patch" ]; then
            patch -p1 --forward < "$DS_DIR/0001-Return-ghost-task-if-task-is-null-and-is-requested-b.patch" || true
          fi

          cat >> arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_SYSVIPC=y
          CONFIG_DEVTMPFS=y
          CONFIG_PID_NS=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_USER_NS=y
          EOF
          echo "✅ Droidspaces support enabled"

      - name: Add IP_SET + IPv6 NAT Support
        if: inputs.ip_set_enable
        working-directory: kernel_workspace/common
        run: |
          echo "Enabling IP_SET + IPv6 NAT..."
          echo "CONFIG_BPF_STREAM_PARSER=y" >> arch/arm64/configs/gki_defconfig
          cat >> arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          EOF

          IPNAT_FIX="../wildkernels_patches/common/IPv6_NAT_FIX.patch"
          if [ -f "$IPNAT_FIX" ]; then
            patch -p1 -F 3 < "$IPNAT_FIX" || true
            echo "✅ IPv6 NAT fix applied"
          else
            echo "⚠️ IPv6_NAT_FIX.patch not found, skipping"
          fi
          echo "✅ IP_SET + IPv6 NAT enabled"

      - name: Add TTL/HL Target Support
        if: inputs.ttl_enable
        working-directory: kernel_workspace/common
        run: |
          echo "Enabling TTL/HL Target (hide tethering from carrier)..."
          cat >> arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          EOF
          echo "✅ TTL/HL Target enabled"

      - name: F2FS Optimizations
        if: inputs.f2fs_opt
        working-directory: kernel_workspace
        run: |
          cat >> common/arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_F2FS_FS=y
          CONFIG_F2FS_STAT_FS=y
          CONFIG_F2FS_FS_XATTR=y
          CONFIG_F2FS_FS_POSIX_ACL=y
          CONFIG_F2FS_FS_SECURITY=y
          CONFIG_F2FS_FS_COMPRESSION=y
          CONFIG_F2FS_FS_LZO=y
          CONFIG_F2FS_FS_LZ4=y
          CONFIG_F2FS_FS_ZSTD=y
          EOF

      - name: Enable WireGuard
        if: inputs.wireguard
        working-directory: kernel_workspace
        run: |
          echo "CONFIG_WIREGUARD=y" >> common/arch/arm64/configs/gki_defconfig

      - name: Enable Full Netfilter
        if: inputs.netfilter_full
        working-directory: kernel_workspace
        run: |
          cat >> common/arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_CONNTRACK_MARK=y
          CONFIG_NF_CONNTRACK_ZONES=y
          CONFIG_NF_CONNTRACK_TIMESTAMP=y
          CONFIG_NF_CONNTRACK_EVENTS=y
          CONFIG_NF_CONNTRACK_TIMEOUT=y
          CONFIG_NF_CONNTRACK_LABELS=y
          CONFIG_NF_NAT=y
          CONFIG_NF_NAT_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_CONNLIMIT=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          EOF

      - name: Enable LRNG v60
        if: inputs.lrng_enable
        working-directory: kernel_workspace/common
        run: |
          patch -p1 --forward --no-backup-if-mismatch < ../wildkernels_patches/common/lrng/lrng_v60_android15-6.6.patch
          cat >> arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_RANDOM_DEFAULT_IMPL=n
          CONFIG_LRNG=y
          CONFIG_LRNG_COLLECTION_SIZE_1024=y
          CONFIG_LRNG_HEALTH_TESTS=y
          CONFIG_LRNG_IRQ=y
          CONFIG_LRNG_CONTINUOUS_COMPRESSION_ENABLED=y
          EOF
          echo "✅ LRNG v60 enabled"

      - name: Enable Wakelock Blocker
        if: inputs.wakelock_blocker
        working-directory: kernel_workspace/common
        run: |
          cat >> arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_PM_WAKELOCKS=y
          CONFIG_PM_WAKELOCKS_GC=y
          CONFIG_PM_WAKELOCKS_LIMIT=100
          EOF

      - name: Configure BBR & Brutal
        run: |
          if [[ "${{ github.event.inputs.bbr_enable }}" != "false" ]]; then
            cd kernel_workspace
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_CUBIC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_VEGAS=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_NV=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_WESTWOOD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_HTCP=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BRUTAL=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_SCH_FQ=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_SCH_FQ_CODEL=y" >> ./common/arch/arm64/configs/gki_defconfig
            if [[ "${{ github.event.inputs.bbr_enable }}" == "default" ]]; then
              echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> ./common/arch/arm64/configs/gki_defconfig
            else
              echo "CONFIG_DEFAULT_TCP_CONG=cubic" >> ./common/arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: Apply BBRv3
        working-directory: kernel_workspace/common
        run: |
          echo "::group::Apply BBRv3 patches"
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_BBR3=y"     >> arch/arm64/configs/gki_defconfig
          BBRV3_PATCH="../wildkernels_patches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-${ANDROID_VERSION}-${KERNEL_VERSION}.patch"
          if [ -f "$BBRV3_PATCH" ]; then
            patch -p1 -F 3 < "$BBRV3_PATCH"
            echo "✅ BBRv3 patch applied"
          else
            echo "::warning::BBRv3 patch not found at $BBRV3_PATCH — skipping"
          fi
          echo "::endgroup::"

      - name: Configure LTO
        run: |
          cd kernel_workspace
          if [[ "${{ github.event.inputs.lto_type }}" == "none" ]]; then
            echo "CONFIG_LTO_NONE=y" >> ./common/arch/arm64/configs/gki_defconfig
          elif [[ "${{ github.event.inputs.lto_type }}" == "full" ]]; then
            echo "CONFIG_LTO_CLANG_FULL=y" >> ./common/arch/arm64/configs/gki_defconfig
          else
            echo "CONFIG_LTO_CLANG_THIN=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi

      - name: Configure ADIOS IO
        if: inputs.adios_enable
        run: |
          cd kernel_workspace
          echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: Configure Re-Kernel
        if: inputs.rekernel_enable
        run: |
          cd kernel_workspace
          echo "CONFIG_REKERNEL=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: Configure Baseband Guard
        if: inputs.baseband_guard
        run: |
          cd kernel_workspace
          echo "CONFIG_BBG=y" >> ./common/arch/arm64/configs/gki_defconfig
          cd ./common
          curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: 📦 Add build name
        run: |
          cd kernel_workspace
          sudo sed -i "s/-4k/-palaziks-ShiftPorts/g" ./common/arch/arm64/configs/gki_defconfig
          sed -i 's/${scm_version}//' ./common/scripts/setlocalversion
          echo "CONFIG_LOCALVERSION_AUTO=n" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 🔨 Build Kernel
        run: |
          WORKDIR="$(pwd)"
          export MAP="-fdebug-prefix-map=${GITHUB_WORKSPACE}=. -fmacro-prefix-map=${GITHUB_WORKSPACE}=. -ffile-prefix-map=${GITHUB_WORKSPACE}=."
          export PATH="$WORKDIR/kernel_workspace/clang-r563880c/bin:$WORKDIR/kernel_workspace/build-tools/linux-x86/bin:$PATH"
          CLANG_DIR="$WORKDIR/kernel_workspace/clang-r563880c/bin"
          echo "Clang: $($CLANG_DIR/clang --version | head -n 1)"
          echo "LLD:   $($CLANG_DIR/ld.lld --version | head -n 1)"
          pahole --version 2>/dev/null || echo "Pahole: Not Installed"

          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_IS_KERNEL_COMPILING=true

          mkdir -p $GITHUB_WORKSPACE/kout
          mkdir -p "$LDCACHE_DIR"

          cd kernel_workspace/common
          set -o pipefail
          : > /tmp/kbuild.log

          echo '#!/bin/bash' > ld-wrapper
          echo 'ld.lld "$@" --thinlto-cache-dir=$LDCACHE_DIR --thinlto-jobs=$(($(nproc --all) / 2))' >> ld-wrapper
          chmod +x ld-wrapper

          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfakestat.so || true
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfaketimeMT.so || true
          chmod 777 ./*.so || true
          SO_DIR=$(pwd)
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"

          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="$(pwd)/ld-wrapper" HOSTLD="$(pwd)/ld-wrapper" \
            O=$GITHUB_WORKSPACE/kout \
            KCFLAGS="-O2 -pipe -Wno-error -Wno-implicit-function-declaration -Wno-implicit-int -Wno-default-const-init-var-unsafe -Wno-format -Wno-unknown-warning-option"\
            gki_defconfig 2>&1 | tee -a /tmp/kbuild.log

          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="$(pwd)/ld-wrapper" HOSTLD="$(pwd)/ld-wrapper" \
            O=$GITHUB_WORKSPACE/kout \
            KCFLAGS="-O2 -pipe -Wno-error -Wno-implicit-function-declaration -Wno-implicit-int -Wno-default-const-init-var-unsafe -Wno-format -Wno-unknown-warning-option ${AFDO_CFLAGS:-} ${EXTRA_CFLAGS:-} ${MAP}" \
            Image 2>&1 | tee -a /tmp/kbuild.log

          echo "Kernel Compilation Complete!"
          ccache -c
          ccache --evict-older-than 10800s
          echo "CCache Status:"
          ccache -s
          df -h

      - name: 🧩 Build Kasumi LKM
        if: inputs.ksumi_lkm
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel_workspace

          echo "📦 Cloning Kasumi..."
          rm -rf kasumi
          git clone --depth=1 https://github.com/Rouyashiki/Kasumi.git kasumi

          echo "🔧 Preparing the same AOSP toolchain used for the 6.6.143 kernel..."
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang-r563880c/bin:$GITHUB_WORKSPACE/kernel_workspace/build-tools/linux-x86/bin:$PATH"
          CLANG_DIR="$GITHUB_WORKSPACE/kernel_workspace/clang-r563880c/bin"
          echo "Clang: $($CLANG_DIR/clang --version | head -n 1)"
          echo "LLD:   $($CLANG_DIR/ld.lld --version | head -n 1)"

          # Each GitHub Actions step has its own shell, so the ld-wrapper
          # created by the kernel build step is not guaranteed to exist here.
          cat > "$GITHUB_WORKSPACE/kernel_workspace/ld-wrapper" <<'EOF'
          #!/bin/bash
          exec ld.lld "$@" --thinlto-cache-dir=$LDCACHE_DIR --thinlto-jobs=$(($(nproc --all) / 2))
          EOF
          chmod +x "$GITHUB_WORKSPACE/kernel_workspace/ld-wrapper"

          # The kernel workflow builds only Image. Prepare the output tree
          # for an external module; Linux 6.6 generates scripts/module.lds
          # through modules_prepare, which is required by the final module link.
          echo "🔧 Preparing kernel tree for external modules..."
          make -C common \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            O=$GITHUB_WORKSPACE/kout \
            modules_prepare

          if [ ! -s "$GITHUB_WORKSPACE/kout/scripts/module.lds" ]; then
            echo "::error::kout/scripts/module.lds was not generated by modules_prepare"
            exit 1
          fi

          # The kernel workflow does not build in-tree modules, so the external
          # module's Module.symvers is absent. vmlinux.symvers is generated
          # during the vmlinux link and contains the exported kernel symbols
          # required by modpost for Kasumi.
          if [ ! -s "$GITHUB_WORKSPACE/kout/Module.symvers" ]; then
            if [ ! -s "$GITHUB_WORKSPACE/kout/vmlinux.symvers" ]; then
              echo "::error::Neither kout/Module.symvers nor kout/vmlinux.symvers exists"
              exit 1
            fi
            cp "$GITHUB_WORKSPACE/kout/vmlinux.symvers" \
               "$GITHUB_WORKSPACE/kout/Module.symvers"
            echo "✅ Prepared kout/Module.symvers from kout/vmlinux.symvers"
          fi

          echo "🔧 Building Kasumi against the prepared 6.6.143 kernel..."
          set -o pipefail
          make -C common \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            LD="$GITHUB_WORKSPACE/kernel_workspace/ld-wrapper" \
            HOSTLD="$GITHUB_WORKSPACE/kernel_workspace/ld-wrapper" \
            O=$GITHUB_WORKSPACE/kout \
            M=$GITHUB_WORKSPACE/kernel_workspace/kasumi/src \
            modules 2>&1 | tee -a /tmp/kasumi-kbuild.log

          KASUMI_KO="$GITHUB_WORKSPACE/kernel_workspace/kasumi/src/kasumi_lkm.ko"
          if [ ! -f "$KASUMI_KO" ]; then
            echo "::error::Kasumi module was not produced: $KASUMI_KO"
            find "$GITHUB_WORKSPACE/kernel_workspace/kasumi/src" -maxdepth 1 -type f -name '*.ko' -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/kasumi-artifact"
          cp "$KASUMI_KO" "$GITHUB_WORKSPACE/kasumi-artifact/kasumi_lkm.ko"
          cp "$GITHUB_WORKSPACE/kernel_workspace/kasumi/src/Module.symvers" "$GITHUB_WORKSPACE/kasumi-artifact/" 2>/dev/null || true

          echo "✅ Kasumi LKM built successfully:"
          ls -lh "$GITHUB_WORKSPACE/kasumi-artifact/"
          file "$GITHUB_WORKSPACE/kasumi-artifact/kasumi_lkm.ko"

      - name: 📦 Save New CCache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: 📦 Save LTO CCache
        if: success() && inputs.lto_type == 'thin'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LDCACHE_DIR }}
          key: lto-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: 🧠 Package AK3 ZIP
        id: create_zip
        run: |
          cd kernel_workspace
          git clone https://github.com/palazik/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp $GITHUB_WORKSPACE/kout/arch/arm64/boot/Image ./Image
          if [[ ! -f ./Image ]]; then
            echo "Kernel Image not found, build may have failed."
            exit 1
          fi
          case "${{ inputs.ksu_type }}" in
            "SukiSU Ultra") KSU_TYPENAME="SukiSU-Ultra" ;;
            "KernelSU Next") KSU_TYPENAME="KSUNext" ;;
            *) KSU_TYPENAME="${{ inputs.ksu_type }}" ;;
          esac
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            wget https://raw.githubusercontent.com/$GITHUB_REPOSITORY/refs/heads/$GITHUB_REF_NAME/zram.zip || true
          fi
          AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_FULL_VERSION }}_palaziks_AOSP-ShiftPorts.zip
          FULL_VERSION=${{ env.KERNEL_FULL_VERSION }}-palaziks_AOSP-ShiftPorts
          zip -r ../$AK3_NAME ./*
          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT

          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "Author: $GITHUB_ACTOR" > ./ak3.log
          echo "Repo: $GITHUB_REPOSITORY" >> ./ak3.log
          echo "Branch: $GITHUB_REF_NAME" >> ./ak3.log
          echo "Run ID: $GITHUB_RUN_ID" >> ./ak3.log
          echo "Commit: $GITHUB_SHA" >> ./ak3.log
          echo "Time: $TIME_NOW" >> ./ak3.log
          echo "Kernel Ver: $FULL_VERSION" >> ./ak3.log
          echo "KSU Branch: ${KSU_TYPENAME}" >> ./ak3.log
          echo "KSU Ver: ${KSUVER}" >> ./ak3.log
          echo "SuSFS: ${{ github.event.inputs.SUSFS }}" >> ./ak3.log
          echo "LZ4: ${{ github.event.inputs.lz4_enable }}" >> ./ak3.log
          echo "LZ4KD: ${{ github.event.inputs.lz4kd_enable }}" >> ./ak3.log
          echo "BBR&Brutal: ${{ github.event.inputs.bbr_enable }}" >> ./ak3.log
          echo "BBRv3: true (stock)" >> ./ak3.log
          echo "ADIOS: ${{ github.event.inputs.adios_enable }}" >> ./ak3.log
          echo "Re-Kernel: ${{ github.event.inputs.rekernel_enable }}" >> ./ak3.log
          echo "BBG: ${{ github.event.inputs.baseband_guard }}" >> ./ak3.log
          echo "NTSync: ${{ github.event.inputs.ntsync_enable }}" >> ./ak3.log
          echo "Droidspaces: ${{ github.event.inputs.droidspaces_enable }}" >> ./ak3.log
          echo "IP_SET+IPv6NAT: ${{ github.event.inputs.ip_set_enable }}" >> ./ak3.log
          echo "TTL: ${{ github.event.inputs.ttl_enable }}" >> ./ak3.log
          echo "MemOpt: ${{ github.event.inputs.mem_opt_patches }}" >> ./ak3.log
          echo "BORE: ${{ github.event.inputs.bore_enable }}" >> ./ak3.log
          zip -z ../$AK3_NAME < ./ak3.log

      - name: 📤 Upload Kasumi LKM
        if: inputs.ksumi_lkm
        uses: actions/upload-artifact@v4
        with:
          name: kasumi-lkm-${{ env.KERNEL_FULL_VERSION }}
          path: |
            ${{ github.workspace }}/kasumi-artifact/kasumi_lkm.ko
            ${{ github.workspace }}/kasumi-artifact/Module.symvers

      - name: 📤 Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_zip.outputs.ak3name }}
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip

      - name: 📝 Make ZRAM module
        run: |
          ZRAM_KO=$(find $GITHUB_WORKSPACE/kout -name "zram.ko" | head -1)
          if [ -z "$ZRAM_KO" ]; then
            echo "⚠️ zram.ko not found, skipping"
            exit 0
          fi
          curl -L "https://github.com/cctv18/oppo_oplus_realme_sm8750/raw/refs/heads/main/zram.zip" -o zram.zip
          unzip -q zram.zip -d zram
          find zram -name "zram.ko" -exec cp "$ZRAM_KO" {} \;
          rm -f zram.zip
          echo "✅ Done!"

      - name: 📤 Upload zram.zip
        uses: actions/upload-artifact@v4
        with:
          name: zram-module
          path: ./zram/*

      - name: Send Telegram Notification (Success)
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +"%Y-%m-%d %H:%M:%S %Z")
          COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-8)
          COMMIT_MSG="Workflow Dispatch: ${{ env.KERNEL_FULL_VERSION }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"


          CAPTION="✅ <b>Kernel Build Successful!</b>

          📱 <b>Device:</b> <code>OnePlus 13 AOSP</code>
          ⚡ <b>KSU:</b> <code>${{ inputs.ksu_type }}</code>
          📅 <b>Date:</b> $DATE
          📝 <b>Commit:</b> <code>$COMMIT_MSG</code>
          🔢 <b>Hash:</b> <a href=\"$REPO_URL/commit/${{ github.sha }}\">$COMMIT_HASH</a>
          🔧 <b>Kernel features:</b> see workflow configuration"

          ZIP_PATH=$(ls ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip | head -n 1)
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F document="@$ZIP_PATH" \
            -F caption="$CAPTION" \
            -F parse_mode="HTML"

      - name: Send Telegram Notification (Failure)
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +"%Y-%m-%d %H:%M:%S %Z")
          COMMIT_MSG="Workflow Dispatch: ${{ env.KERNEL_FULL_VERSION }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          CAPTION="❌ <b>Kernel Build Failed!</b>

          📱 <b>Device:</b> <code>OnePlus 13 AOSP</code>
          ⚡ <b>KSU:</b> <code>${{ inputs.ksu_type }}</code>
          📅 <b>Date:</b> $DATE
          📝 <b>Commit:</b> <code>$COMMIT_MSG</code>
          🔢 <b>Hash:</b> <a href=\"$REPO_URL/commit/${{ github.sha }}\">$(echo "${{ github.sha }}" | cut -c1-8)</a>"

          if [ -s /tmp/kbuild.log ]; then
            tail -n 3000 /tmp/kbuild.log > /tmp/kbuild_tail.log
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
              -F chat_id="$TELEGRAM_CHAT_ID" \
              -F document="@/tmp/kbuild_tail.log" \
              -F caption="$CAPTION" \
              -F parse_mode="HTML"
          else
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="$CAPTION" \
              -d parse_mode="HTML"
          fi

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: Download ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: ./release_zips

      - name: Set Environment Variables
        run: |
          FULL_VERSION=${{ env.KERNEL_FULL_VERSION }}-palaziks_AOSP-ShiftPorts
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          TAG_HEAD="OPPO-OPlus-Realme-build"
          echo "TAG_HEAD=$TAG_HEAD" >> $GITHUB_ENV
          echo "KSU_TYPENAME=${{ inputs.ksu_type }}" >> $GITHUB_ENV

      - name: Create Release
        if: ${{ github.event.inputs.github_release == 'true' }}
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 OnePlus 13 ${{ inputs.ksu_type }} SM8750 AOSP Clang
          > ⚠️ **ROM Compatibility:** Built with **AOSP Clang** for **AOSP-based ROMs** only. To flash on **ColorOS / OxygenOS**, run the `OP13 Kernel Build` workflow yourself (ZyCromerZ Clang builds are for ColorOS / OxygenOS only).

          - **Kernel Version:** ${{ env.FULL_VERSION }}
          - **Build Time:** ${{ env.TIME_FORM }}
          - **KSU Branch:** ${{ inputs.ksu_type }}
          - **SuSFS:** ${{ github.event.inputs.SUSFS }}
          - **NTSync:** ${{ github.event.inputs.ntsync_enable }}
          - **Droidspaces:** ${{ github.event.inputs.droidspaces_enable }}
          - **IP_SET + IPv6 NAT:** ${{ github.event.inputs.ip_set_enable }}
          - **TTL Target:** ${{ github.event.inputs.ttl_enable }}
          - **Memory & Scheduler Optimizations:** ${{ github.event.inputs.mem_opt_patches }}
          - **Multi-Manager:** true
          - **LZ4:** ${{ github.event.inputs.lz4_enable }}
          - **LZ4KD:** ${{ github.event.inputs.lz4kd_enable }}
          - **BTF + eBPF + FUSE-BPF:** ${{ github.event.inputs.bpf_stack_enable }}
          - **BBR/Brutal:** ${{ github.event.inputs.bbr_enable }}
          - **BBRv3:** true (stock)
          - **ADIOS IO:** ${{ github.event.inputs.adios_enable }}
          - **Baseband Guard:** ${{ github.event.inputs.baseband_guard }}
          - **Fengchi:** ${{ github.event.inputs.fengchi }}
          - **Oryon CPU Optimizations:** ${{ github.event.inputs.cpu_opt }}
          - **Unicode Fix:** true (stock)
          - **BORE Scheduler:** ${{ github.event.inputs.bore_enable }}
          - **WireGuard:** ${{ github.event.inputs.wireguard }}
          - **LRNG v60:** ${{ github.event.inputs.lrng_enable }}
          - **Wakelock Blocker:** ${{ github.event.inputs.wakelock_blocker }}
          EOF

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-${{ env.FULL_VERSION }}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip
\\n'*}"
            AFDO_ACCESS_TOKEN=""

            if [ "$TOKEN_HTTP_STATUS" = "200" ]; then
              AFDO_ACCESS_TOKEN=$(printf '%s' "$TOKEN_BODY" | jq -r '.access_token // empty')
              if [ -n "$AFDO_ACCESS_TOKEN" ]; then
                echo "::add-mask::$AFDO_ACCESS_TOKEN"
                echo "✅ Google OAuth access token acquired."
              else
                echo "❌ Google OAuth returned HTTP 200 without access_token; AFDO will be disabled."
              fi
            else
              OAUTH_ERROR=$(printf '%s' "$TOKEN_BODY" | jq -r '.error // empty' 2>/dev/null || true)
              OAUTH_ERROR_DESCRIPTION=$(printf '%s' "$TOKEN_BODY" | jq -r '.error_description // empty' 2>/dev/null || true)

              echo "⚠️ Google OAuth token refresh failed (HTTP ${TOKEN_HTTP_STATUS:-unknown})."
              echo "OAuth error: ${OAUTH_ERROR:-unknown}"
              echo "OAuth description: ${OAUTH_ERROR_DESCRIPTION:-unknown}"
              echo "AFDO will be disabled; continuing without AFDO optimization."
            fi

            unset TOKEN_BODY TOKEN_RESPONSE OAUTH_ERROR OAUTH_ERROR_DESCRIPTION

            if [ -n "$AFDO_ACCESS_TOKEN" ]; then
              AFDO_URL="https://android.googlesource.com/kernel/common/+/refs/heads/android15-6.6/android/gki/aarch64/afdo/kernel.afdo?format=TEXT"
              echo "Trying authenticated AFDO source: $AFDO_URL"

              AFDO_HTTP_STATUS=$(curl -sS -L \
                --retry 3 \
                --retry-all-errors \
                --retry-delay 2 \
                --connect-timeout 20 \
                --max-time 180 \
                -H "Authorization: Bearer $AFDO_ACCESS_TOKEN" \
                -o "$AFDO_B64" \
                -w '%{http_code}' \
                "$AFDO_URL" || true)

              echo "AFDO HTTP status: $AFDO_HTTP_STATUS"

              if [ "$AFDO_HTTP_STATUS" = "200" ]; then
                echo "AFDO encoded size: $(wc -c < "$AFDO_B64") bytes"

                if tr -d '\r\n' < "$AFDO_B64" | base64 -d -i > "$AFDO_OUT" 2>/dev/null \
                  && test -s "$AFDO_OUT"; then
                  echo "AFDO decoded size: $(wc -c < "$AFDO_OUT") bytes"
                  AFDO_CFLAGS="-fprofile-sample-use=$AFDO_OUT"
                  echo "✅ AFDO downloaded with Google OAuth authentication"
                else
                  echo "❌ HTTP 200 received, but the response is not valid base64 AFDO data."
                  rm -f "$AFDO_OUT"
                fi
              else
                echo "❌ Authenticated AFDO download failed (HTTP $AFDO_HTTP_STATUS)."
                rm -f "$AFDO_B64" "$AFDO_OUT"
              fi

              unset AFDO_ACCESS_TOKEN
            fi
          fi
          
          if [ -n "$AFDO_CFLAGS" ]; then
            echo "AFDO_CFLAGS=$AFDO_CFLAGS" >> "$GITHUB_ENV"
            echo "✅ AFDO enabled"
          else
            echo "AFDO_CFLAGS=" >> "$GITHUB_ENV"
            echo "⚠️ AFDO unavailable; continuing without AFDO optimization"
          fi
          
          unset AFDO_ACCESS_TOKEN
          rm -f "$AFDO_B64"
          
          echo "Source and tools initialized successfully!"

      - name: Cache ccache-ECS binary
        uses: actions/cache@v4
        id: ecs-cache
        with:
          path: /tmp/ccache-ecs-bin
          key: ccache-ecs-${{ runner.os }}-084a7620

      - name: Build & Install ccache-ECS
        run: |
          if [ -f /tmp/ccache-ecs-bin/ccache ]; then
            echo "ECS binary cached, skipping build"
            sudo cp /tmp/ccache-ecs-bin/ccache /usr/local/bin/ccache
          else
            sudo apt-get install -y --no-install-recommends cmake
            git clone --depth=1 https://github.com/cctv18/ccache-ECS.git /tmp/ccache-ecs
            cd /tmp/ccache-ecs
            ./ci/build-binary
            mkdir -p /tmp/ccache-ecs-bin
            cp install/ccache /tmp/ccache-ecs-bin/ccache
            sudo cp /tmp/ccache-ecs-bin/ccache /usr/local/bin/ccache
          fi
          sudo chmod 755 /usr/local/bin/ccache
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "✅ ECS ccache: $(/usr/local/bin/ccache --version | head -1)"

      - name: Save ccache-ECS binary cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/ccache-ecs-bin
          key: ccache-ecs-${{ runner.os }}-084a7620

      - name: Configure CCache Directory
        run: |
          echo "CCACHE_KEY=ccache-neov4-${{ env.KERNEL_FULL_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_FULL_VERSION }}" >> $GITHUB_ENV
          echo "LDCACHE_DIR=$GITHUB_WORKSPACE/ldcache_${{ env.KERNEL_FULL_VERSION }}" >> $GITHUB_ENV
          mkdir -p $GITHUB_WORKSPACE/ldcache_${{ env.KERNEL_FULL_VERSION }}
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV
          echo "Current Disk Space:"
          df -h
          echo "Current Build Kernel Version: ${{ env.KERNEL_FULL_VERSION }}"

      - name: Restore CCache
        uses: actions/cache/restore@v4
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_KEY }}-

      - name: Restore LTO Cache
        uses: actions/cache/restore@v4
        if: inputs.lto_type == 'thin'
        with:
          path: ${{ env.LDCACHE_DIR }}
          key: lto-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            lto-cache-${{ runner.os }}-${{ github.ref_name }}-

      - name: Init and Config CCache
        run: |
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          mkdir -p "$CCACHE_DIR"

          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -o compression=true
          ccache -o compiler_check=none
          ccache -o hash_dir=false
          ccache -o direct_mode=true
          ccache -o depend_mode=false
          ccache -o base_dir="${{ github.workspace }}"
          ccache -o sloppiness=file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros,locale

          echo "Initial CCache status:"
          ccache -s

          echo "Updating atime to achieve cache eviction..."
          find "${{ env.CCACHE_DIR }}" -type f -exec touch -t $(date -d "1 day ago" +%Y%m%d%H%M) {} + || true

      - name: ⚡ Setup ReSukiSU
        if: inputs.ksu_type == 'ReSukiSU'
        run: |
          cd kernel_workspace/common
          echo "🛠️ Setting up ReSukiSU (main)..."
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main
          cd KernelSU
          KSU_VERSION_COUNT=$(git rev-list --count HEAD)
          export KSUVER=$(expr $KSU_VERSION_COUNT + 37185)
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV
          echo "✅ ReSukiSU $(git rev-parse --short HEAD) (ver $KSUVER)"

      - name: ⚡ Setup SukiSU Ultra
        if: inputs.ksu_type == 'SukiSU Ultra'
        run: |
          cd kernel_workspace/common
          echo "🛠️ Setting up SukiSU Ultra (builtin)..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh" | bash -s builtin
          cd KernelSU
          KSU_VERSION_COUNT=$(git rev-list --count HEAD)
          export KSUVER=$(expr $KSU_VERSION_COUNT + 37185)
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV
          KSU_API_VERSION=$(grep -E "^KSU_VERSION[[:space:]]*=" "../Makefile" | cut -d'=' -f2 | tr -d '[:space:]')
          [ -z "$KSU_API_VERSION" ] && KSU_API_VERSION="12800"
          KSU_COMMIT_HASH=$(git rev-parse --short=8 HEAD)
          KBUILD_FILE="kernel/Makefile"
          [ -f "kernel/Kbuild" ] && KBUILD_FILE="kernel/Kbuild"
          sed -i 's/-DKSU_VERSION_FULL=[^ ]*//g' "$KBUILD_FILE"
          sed -i '/KSU_VERSION_FULL/d' "$KBUILD_FILE"
          cat >> "$KBUILD_FILE" <<EOF
          ccflags-y += -DKSU_VERSION_FULL=\"v${KSU_API_VERSION}-${KSU_COMMIT_HASH}@palaziks\"
          EOF
          echo "✅ SukiSU $KSUVER (v${KSU_API_VERSION}-${KSU_COMMIT_HASH}@palaziks)"

      - name: ⚡ Setup KernelSU
        if: inputs.ksu_type == 'KernelSU'
        run: |
          cd kernel_workspace/common
          echo "🛠️ Setting up KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          cd KernelSU
          git fetch --force origin main
          git checkout -B main origin/main
          KSU_GIT_VERSION=$(git rev-list --count origin/main)
          export KSUVER=$(expr 10000 + $KSU_GIT_VERSION + 200)
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV
          echo "✅ KernelSU $(git describe --tags 2>/dev/null || git rev-parse --short HEAD)  (ver $KSUVER)"

      - name: ⚡ Setup KernelSU Next
        if: inputs.ksu_type == 'KernelSU Next'
        run: |
          cd kernel_workspace/common
          echo "🛠️ Setting up KernelSU-Next (dev branch)..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev
          cd KernelSU-Next
          KSU_GIT_VERSION=$(git rev-list --count HEAD)
          export KSUVER=$(expr 10000 + $KSU_GIT_VERSION + 200)
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV
          echo "✅ KernelSU-Next $(git describe --tags 2>/dev/null || git rev-parse --short HEAD)  (ver $KSUVER)"

      - name: 🔧 Setup Patches
        run: |
          cd kernel_workspace
          if [ "${{ github.event.inputs.SUSFS }}" == "true" ]; then
            git clone --depth=1 -b gki-android15-6.6 https://gitlab.com/simonpunk/susfs4ksu.git &
          fi
          git clone --depth=1 https://github.com/mrcxlinux/kernel_patches.git &
          git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git &
          git clone --depth=1 https://github.com/palazik/kernel_patches.git wildkernels_patches &
          wait

          if [ "${{ github.event.inputs.SUSFS }}" == "true" ]; then
            cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch ./common/
            cp susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          fi

          cd ./common
          cp ../kernel_patches/common/EnablePOLLY.patch ./
          git apply -p1 < EnablePOLLY.patch || true
          echo "✅ Base patches applied"

      - name: 📦 Apply SUSFS (ReSukiSU / SukiSU Ultra)
        if: inputs.SUSFS && (inputs.ksu_type == 'ReSukiSU' || inputs.ksu_type == 'SukiSU Ultra')
        working-directory: kernel_workspace/common
        run: |
          echo "📦 Pre-patch fixups (fatalcoder android15-6.6 method)..."
          if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
            sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' \
                   -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
          fi
          if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
          fi
          if ! grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then
            sed -i '/#include <linux\/sched\/sysctl\.h>/a #include <linux\/zswap.h>' ./mm/memory.c
          fi
          if grep -qF 'if (vma->vm_end > last_vma_end)' ./fs/proc/task_mmu.c \
             && ! grep -qF 'if (vma->vm_end > last_vma_end) {' ./fs/proc/task_mmu.c; then
            perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\)\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);/\t\t\tif (vma->vm_end > last_vma_end) {\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t}/' ./fs/proc/task_mmu.c
          fi

          echo "📦 Applying 50_ with --forward (by-design rejects skip cleanly)..."
          patch -p1 --forward < 50_add_susfs_in_gki-android15-6.6.patch || true

          grep -q "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))" fs/proc/task_mmu.c \
            || { echo "❌ SUS_MAP guard missing — real failure"; exit 1; }
          echo "✅ SUSFS applied (fatalcoder method)"

      - name: 📦 Apply SUSFS (KernelSU)
        if: inputs.SUSFS && inputs.ksu_type == 'KernelSU'
